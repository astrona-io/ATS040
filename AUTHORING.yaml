version: 1
approval: KCNA-LESSON-PLAN.md approved; hands-on scope (playgrounds, labs, capstones, quiz.yaml) approved by the maintainer after the reading-only correction
course:
  id: ATS040
  certification:
    name: Kubernetes and Cloud Native Associate
    code: KCNA
    provider: CNCF / Linux Foundation
    domain: Cloud Native Architecture
    weight: 12
    competencies:
    - Observability
    - Cloud Native Ecosystem and Principles
    - Cloud Native Community and Collaboration
defaults:
  playground: true
  module_lab: true
  capstone: true
  section_quiz: true
  final_quiz: true
sections:
- id: section-010
  title: Observability
  curriculum_item: Observability
  modules:
  - id: module-01
    title: Observability And Reliability
    objectives:
    - Choose metrics, logs or traces for a diagnostic question.
    - Explain instrumentation, collection and visualization responsibilities.
    - Distinguish an SLI, SLO and SLA.
    - Calculate an error budget and relate alerts to user impact.
    outline:
    - Metrics, Logs And Traces
    - Instrumentation And Telemetry Pipelines
    - Service Objectives, Budgets And Alerts
    - Kubernetes Built-In Observability
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  - id: module-02
    title: OpenTelemetry, Tracing And Logs
    objectives:
    - Explain the OpenTelemetry API, SDK, Collector and OTLP.
    - Describe distributed tracing, context propagation and sampling.
    - Describe how logs are collected in Kubernetes.
    - Configure telemetry for a workload and a Collector pipeline.
    outline:
    - Signals, Instrumentation And OTLP
    - Collector And Pipelines
    - Distributed Tracing And Sampling
    - Logs In Kubernetes
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  - id: module-03
    title: Prometheus And PromQL
    objectives:
    - Describe the Prometheus architecture and data model.
    - Choose between counter, gauge, histogram and summary.
    - Write PromQL queries for rates and percentiles.
    - Write recording and alerting rules and describe Alertmanager and dashboards.
    outline:
    - Architecture And Data Model
    - Metric Types And Exposition
    - PromQL
    - Alerting, Alertmanager And Dashboards
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  - id: module-04
    title: Cloud Cost Management
    objectives:
    - Name the main cost drivers of a cluster.
    - Explain requests, usage, quota and rightsizing.
    - Allocate cost with labels and describe cost tools.
    - Compare purchasing options and scaling levers.
    outline:
    - Cost Drivers And FinOps
    - Requests, Usage, Quota And Rightsizing
    - Allocation, Labels And Cost Tools
    - Purchasing Options And Scaling Levers
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  capstone: true
  section_quiz: true
- id: section-020
  title: Cloud Native Ecosystem and Principles
  curriculum_item: Cloud Native Ecosystem and Principles
  modules:
  - id: module-01
    title: Cloud Native Design
    objectives:
    - Explain loose coupling and microservice tradeoffs.
    - Relate resilience, elasticity and external state to replaceable workloads.
    - Distinguish serverless execution from the absence of servers.
    - Explain asynchronous delivery, retries and idempotency.
    outline:
    - Boundaries, Resilience And Elasticity
    - Serverless And Event-Driven Workloads
    - Twelve-Factor And Immutable Infrastructure
    - Container Design Patterns
    playground: true
    module_lab: true
    labs: 2
    diagrams: []
  - id: module-02
    title: Cloud Native Ecosystem
    objectives:
    - Explain how open standards support interoperability.
    - Match representative projects to their technical roles.
    - Distinguish a specification, implementation and managed service.
    - Choose tools from requirements and operating constraints.
    outline:
    - Standards And Implementation Boundaries
    - Matching Projects To Platform Jobs
    - The CNCF Landscape By Category
    - Evaluating And Adopting A Project
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  - id: module-03
    title: Autoscaling
    objectives:
    - Explain how the Horizontal Pod Autoscaler computes a replica count.
    - Distinguish horizontal, vertical and cluster scaling.
    - Explain event-driven scaling and scaling behavior.
    outline:
    - Horizontal Pod Autoscaler
    - Vertical And Cluster Scaling
    - Event-Driven Scaling And Behavior
    - Troubleshooting Autoscaling
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  - id: module-04
    title: Open Standards And Interfaces
    objectives:
    - Explain the value of open standards and the OCI specifications.
    - Describe the CRI, runtime classes, CNI and CSI.
    - Name the mesh, event and telemetry standards.
    - Use a RuntimeClass and a persistent volume.
    outline:
    - Open Standards And The OCI Specifications
    - Container Runtime Interface And Runtime Classes
    - Container Network And Storage Interfaces
    - Mesh, Event And Telemetry Standards
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  - id: module-05
    title: Serverless And Event-Driven Platforms
    objectives:
    - Define serverless, Functions as a Service and Backend as a Service.
    - Describe Knative Serving and Eventing and KEDA.
    - Create Jobs and CronJobs with limits.
    - Choose between serverless, containers and virtual machines.
    outline:
    - The Serverless Model
    - Knative Serving And Eventing
    - Scale To Zero, Event-Driven Scaling And Batch Workloads
    - Choosing Serverless, Containers Or Virtual Machines
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  - id: module-06
    title: Cloud Native Roles And Personas
    objectives:
    - Name the main cloud native roles and their responsibilities.
    - Explain platform engineering and golden paths.
    - Map personas to RBAC Roles and test access.
    - Describe DevOps and site reliability engineering practices.
    outline:
    - The Main Cloud Native Roles
    - Platform Engineering And Team Topologies
    - Role-Based Access Control For Personas
    - DevOps And Site Reliability Engineering Practices
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  capstone: true
  section_quiz: true
- id: section-030
  title: Cloud Native Community and Collaboration
  curriculum_item: Cloud Native Community and Collaboration
  modules:
  - id: module-01
    title: Community And Collaboration
    objectives:
    - Explain project governance and foundation maturity categories.
    - Distinguish licensing permission from contribution acceptance.
    - Describe an issue, pull request and review workflow.
    - Identify a suitable SIG or working group for a focused contribution.
    outline:
    - Governance, Maturity And Licenses
    - Issues, Reviews And Working Groups
    - Licenses In Depth
    - Judging Project Health
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  - id: module-02
    title: API Maturity And Deprecation
    objectives:
    - Describe alpha, beta and stable API levels and feature gates.
    - Apply the deprecation policy windows.
    - Find clients that use deprecated versions.
    - Migrate manifests and check them with a dry run and a diff.
    outline:
    - API Maturity Levels And Feature Gates
    - Deprecation Policy And Finding Deprecated Use
    - Migrating Manifests To Current Versions
    - Custom Resource Versions And Conversion
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  - id: module-03
    title: CNCF Structure And Kubernetes Governance
    objectives:
    - Describe the CNCF bodies and the project lifecycle.
    - Describe SIGs, working groups, KEPs and OWNERS files.
    - Explain the release cycle and version support.
    - Describe the Code of Conduct and ways to take part.
    outline:
    - CNCF Structure And The Project Lifecycle
    - Kubernetes Governance, SIGs And KEPs
    - The Release Cycle And Version Support
    - The Code Of Conduct And Taking Part
    playground: true
    module_lab: true
    labs: 1
    diagrams: []
  capstone: true
  section_quiz: true
assessment_format: quiz.yaml per section and sections/final-domain-quiz.yaml (ATS021 format); earlier YAML banks kept in assessments/
