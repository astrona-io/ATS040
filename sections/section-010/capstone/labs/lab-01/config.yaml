# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Observability Capstone (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-040-capstone-010
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0
      - quay.io/prometheus/prometheus:v3.5.0

# Starting state.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting objects
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: prometheus-ready
      description: "Prometheus is Ready and drifter is still running"
      type: file
      source: validation/validate-prometheus-ready.sh
      hint: "Keep both ConfigMaps valid and do not delete drifter."
    - name: beacon-scraped
      description: "The job beacon scrapes beacon every 10 seconds with the label team=orbit and the target is up"
      type: file
      source: validation/validate-beacon-up.sh
      hint: "Add a scrape job and make Prometheus load it. A ConfigMap change needs a restart or a reload."
    - name: error-ratio-recorded
      description: "Recording rule beacon:http_error_ratio:rate5m returns a plausible 5xx ratio"
      type: file
      source: validation/validate-recording-rule.sh
      hint: "Divide the 5xx request rate by the total request rate for job beacon over 5 minutes."
    - name: burn-alert
      description: "Alert BeaconErrorBudgetBurn uses 14.4 times the allowed ratio of a 99.5 percent objective, for 2 minutes, severity page"
      type: file
      source: validation/validate-burn-alert.sh
      hint: "Allowed ratio is 0.005, so the threshold is 14.4 * 0.005 = 0.072."
    - name: down-alert
      description: "Alert BeaconDown fires when up{job=\"beacon\"} is 0 for 1 minute with severity page and a summary"
      type: file
      source: validation/validate-down-alert.sh
      hint: "Use the expression up{job=\"beacon\"} == 0 with for: 1m."
    - name: slo-record
      description: "ConfigMap beacon-slo records the objective, the allowed ratio and the 30 day budget in minutes"
      type: file
      source: validation/validate-slo-record.sh
      hint: "99.5 percent over 30 days leaves 0.5 percent of 43200 minutes, which is 216."

teardown:
  keepCluster: false
