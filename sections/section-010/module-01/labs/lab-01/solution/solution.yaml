# Reference solution: the scout scrape job and the two rules.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: scout
        scrape_interval: 10s
        static_configs:
          - targets: ["scout.starfleet.svc.cluster.local:9898"]
            labels:
              env: lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  rules.yml: |
    groups:
      - name: scout-slo
        rules:
          - record: scout:http_error_ratio:rate5m
            expr: sum(rate(http_requests_total{job="scout",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="scout"}[5m]))
          - alert: ScoutErrorBudgetBurn
            expr: scout:http_error_ratio:rate5m > 14.4 * 0.001
            for: 2m
            labels:
              severity: page
            annotations:
              summary: scout is spending its 99.9% error budget 14.4 times too fast
