# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Build A Resilient Replaceable Workload (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-040-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting objects
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: three-replicas
      description: "scout has three replicas, all available"
      type: file
      source: validation/validate-replicas.sh
      hint: "Set spec.replicas to 3 and wait until all three pods are Ready."
    - name: probes-configured
      description: "scout has a readiness probe on /readyz and a liveness probe on /healthz"
      type: file
      source: validation/validate-probes.sh
      hint: "Add readinessProbe httpGet /readyz and livenessProbe httpGet /healthz on the container port."
    - name: requests-set
      description: "scout declares cpu and memory requests"
      type: file
      source: validation/validate-requests.sh
      hint: "Add resources.requests.cpu and resources.requests.memory to the scout container."
    - name: config-externalized
      description: "PODINFO_UI_MESSAGE comes from the ConfigMap scout-config, not from an inline value"
      type: file
      source: validation/validate-config.sh
      hint: "Create the ConfigMap scout-config and reference it with envFrom or valueFrom.configMapKeyRef. Remove the inline value."
    - name: pdb-minavailable-2
      description: "A PodDisruptionBudget keeps at least two scout pods"
      type: file
      source: validation/validate-pdb.sh
      hint: "Create a policy/v1 PodDisruptionBudget with minAvailable 2 and selector app=scout."
    - name: scout-serves
      description: "shuttle gets HTTP 200 from scout"
      type: file
      source: validation/validate-serves.sh
      hint: "Check that the new pods are Running and Ready."

teardown:
  keepCluster: false
