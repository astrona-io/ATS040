apiVersion: v1
kind: ConfigMap
metadata:
  name: ecosystem-notes
  namespace: starfleet
data:
  metrics: observability
  gitops: continuous-delivery
  runtime: container-runtime
  mesh: service-mesh
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sensors.fleet.example.com
spec:
  group: fleet.example.com
  scope: Namespaced
  names:
    plural: sensors
    singular: sensor
    kind: Sensor
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["target"]
              properties:
                target:
                  type: string
                intervalSeconds:
                  type: integer
                  minimum: 1
                  default: 30
