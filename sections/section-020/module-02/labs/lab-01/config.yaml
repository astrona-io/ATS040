# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Extend Kubernetes With A Custom Resource (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-040-lab-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

# Starting state.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting objects
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: platform-job-notes
      description: "ConfigMap ecosystem-notes maps four platform jobs to their categories"
      type: file
      source: validation/validate-notes.sh
      hint: "Create ConfigMap ecosystem-notes in starfleet with keys metrics, gitops, runtime and mesh and the category names from the question."
    - name: crd-defined
      description: "CRD sensors.fleet.example.com is namespaced, served and stored as v1 with kind Sensor"
      type: file
      source: validation/validate-crd.sh
      hint: "Name the CRD sensors.fleet.example.com, group fleet.example.com, scope Namespaced, kind Sensor, version v1 with served and storage true."
    - name: crd-schema
      description: "The schema requires target and limits intervalSeconds to an integer of at least 1 with default 30"
      type: file
      source: validation/validate-schema.sh
      hint: "Add an openAPIV3Schema with required target, and intervalSeconds as integer with minimum 1 and default 30."
    - name: sensor-created
      description: "Sensor scout-sensor exists with target scout and the defaulted interval 30"
      type: file
      source: validation/validate-sensor.sh
      hint: "Create the Sensor without intervalSeconds so the API server applies the default."
    - name: invalid-sensor-rejected
      description: "The API server rejects a Sensor with intervalSeconds 0 and one without target"
      type: file
      source: validation/validate-rejects.sh
      hint: "The schema must enforce minimum 1 and the required target field."

teardown:
  keepCluster: false
