apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: standard-runc
handler: runc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logbook
  namespace: starfleet
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: recorder
  namespace: starfleet
spec:
  runtimeClassName: standard-runc
  containers:
    - name: recorder
      image: curlimages/curl:8.22.0
      command: ["sh", "-c", "echo recorded > /data/entry.txt; sleep 3600"]
      volumeMounts:
        - name: logbook
          mountPath: /data
  volumes:
    - name: logbook
      persistentVolumeClaim:
        claimName: logbook
