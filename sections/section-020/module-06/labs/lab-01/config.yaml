# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Give Two Personas The Access They Need (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-040-lab-020-06
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

# Starting state.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting objects
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: roles-exist
      description: "Roles developer and auditor exist in starfleet"
      type: file
      source: validation/validate-roles-exist.sh
      hint: "Create both Roles in the namespace starfleet."
    - name: bindings
      description: "RoleBindings bind developer to riker and auditor to data"
      type: file
      source: validation/validate-bindings.sh
      hint: "Check roleRef and subjects of both bindings."
    - name: developer-access
      description: "riker can create Deployments and read logs but cannot delete them or read Secrets"
      type: file
      source: validation/validate-developer-access.sh
      hint: "Check the verbs in the developer Role."
    - name: auditor-access
      description: "data can read Pods and Deployments but cannot change them or read Secrets"
      type: file
      source: validation/validate-auditor-access.sh
      hint: "Check the verbs and resources in the auditor Role."
    - name: scope
      description: "Neither user has access in the namespace default"
      type: file
      source: validation/validate-scope.sh
      hint: "Use Roles and RoleBindings, not cluster-wide objects."

teardown:
  keepCluster: false
