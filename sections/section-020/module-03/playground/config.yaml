# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Autoscaling (PLAYGROUND) - playground environment.
# Sandbox with Metrics Server, the scout application with a CPU request and a shuttle curl pod, used to create and tune a HorizontalPodAutoscaler.
# A clean sandbox with no task, no grading and no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-040-playground-020-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0
    addons:
      metricsServer: true

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
