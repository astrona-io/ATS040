# Knowledge check. Listed in astrona.yaml as a `type: quiz` entry.
schema_version: 1
kind: question_bank
id: ats040-030
course_id: ATS040
exam_code: KCNA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Community And API Lifecycle"
questions:
  - id: ats040-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Order the CNCF maturity levels"
    source_readings:
      - sections/section-030/module-01/course-01-governance-maturity-and-licenses.md
    prompt: |-
      Which list shows the CNCF project maturity levels from earliest to latest?
    options:
      - id: a
        text: "Incubating, sandbox, graduated"
        explanation: "Sandbox is the entry level."
      - id: b
        text: "Sandbox, incubating, graduated"
        explanation: "Correct. Projects enter at sandbox, move to incubating and reach graduated."
      - id: c
        text: "Graduated, incubating, sandbox"
        explanation: "This is the reverse order."
      - id: d
        text: "Alpha, beta, stable"
        explanation: "These are Kubernetes API maturity levels, not CNCF project levels."
    correct_option: b
    explanation: "Projects enter at sandbox, move to incubating and reach graduated."

  - id: ats040-030-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the Apache 2.0 properties"
    source_readings:
      - sections/section-030/module-01/course-01-governance-maturity-and-licenses.md
    prompt: |-
      Which statement about the Apache 2.0 license is correct?
    options:
      - id: a
        text: "It requires every user to publish their own source code."
        explanation: "That is a copyleft requirement, not a permissive one."
      - id: b
        text: "It forbids commercial use."
        explanation: "Commercial use is allowed."
      - id: c
        text: "It is permissive and includes an explicit patent grant from contributors."
        explanation: "Correct. The license allows use, change and distribution, and gives users a patent license for the contribution."
      - id: d
        text: "It has no terms about patents."
        explanation: "It has an explicit patent grant."
    correct_option: c
    explanation: "The license allows use, change and distribution, and gives users a patent license for the contribution."

  - id: ats040-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell a SIG from a working group"
    source_readings:
      - sections/section-030/module-01/course-02-issues-reviews-and-working-groups.md
    prompt: |-
      What is the difference between a special interest group and a working group in Kubernetes?
    options:
      - id: a
        text: "A working group owns code and a SIG does not."
        explanation: "SIGs own code areas."
      - id: b
        text: "They are the same and only the name differs."
        explanation: "Their scope and lifetime differ."
      - id: c
        text: "A SIG is a company team and a working group is a community team."
        explanation: "Both are open community groups."
      - id: d
        text: "A SIG owns an area of the project long term, and a working group handles a cross-cutting topic for a limited time."
        explanation: "Correct. SIGs have lasting ownership of code and areas. Working groups bring several SIGs together on one topic and end when it is done."
    correct_option: d
    explanation: "SIGs have lasting ownership of code and areas. Working groups bring several SIGs together on one topic and end when it is done."

  - id: ats040-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Route a bug report"
    source_readings:
      - sections/section-030/module-01/course-02-issues-reviews-and-working-groups.md
    prompt: |-
      A user finds that a CronJob skips runs. Which action gets the report to the right group?
    options:
      - id: a
        text: "Open an issue with reproduction steps and the version, and label it for the SIG that owns the area."
        explanation: "Correct. A complete report with the version and steps, routed to the owning SIG, can be triaged and fixed."
      - id: b
        text: "Send a private message to a random maintainer."
        explanation: "This bypasses triage and leaves no public record."
      - id: c
        text: "Open a pull request with an empty change and describe the bug in it."
        explanation: "An issue is the place for a report. A pull request is for a change."
      - id: d
        text: "Wait for the next release and see if it still happens."
        explanation: "The group cannot act on a problem it does not know about."
    correct_option: a
    explanation: "A complete report with the version and steps, routed to the owning SIG, can be triaged and fixed."

  - id: ats040-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain an enhancement proposal"
    source_readings:
      - sections/section-030/module-01/course-02-issues-reviews-and-working-groups.md
    prompt: |-
      Where is a significant new feature for Kubernetes described before it is built?
    options:
      - id: a
        text: "In a commit message."
        explanation: "A commit message is too small for design review."
      - id: b
        text: "In a Kubernetes Enhancement Proposal (KEP), which records the goal, design and graduation criteria."
        explanation: "Correct. A KEP lets the community review a large change before work starts."
      - id: c
        text: "In a Slack thread only."
        explanation: "A thread is not a durable, reviewable record."
      - id: d
        text: "In the release notes after the release."
        explanation: "Release notes describe what shipped, not the proposal."
    correct_option: b
    explanation: "A KEP lets the community review a large change before work starts."

  - id: ats040-030-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what an alpha API means"
    source_readings:
      - sections/section-030/module-02/course-01-api-maturity-levels-and-feature-gates.md
    prompt: |-
      What is true for an alpha API version in Kubernetes?
    options:
      - id: a
        text: "It is on by default and will never change."
        explanation: "This describes a stable API."
      - id: b
        text: "It is supported for 12 months after deprecation."
        explanation: "Alpha has no such guarantee."
      - id: c
        text: "It is off by default, may change, and can be removed without notice."
        explanation: "Correct. Alpha versions are for early feedback and carry no stability promise."
      - id: d
        text: "It is safe to use for production data."
        explanation: "Alpha features can be buggy and can disappear."
    correct_option: c
    explanation: "Alpha versions are for early feedback and carry no stability promise."

  - id: ats040-030-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "State the beta deprecation window"
    source_readings:
      - sections/section-030/module-02/course-02-deprecation-policy-and-finding-deprecated-use.md
    prompt: |-
      After a beta API version is deprecated, how long does the Kubernetes deprecation policy keep it?
    options:
      - id: a
        text: "Not at all. It is removed in the same release."
        explanation: "The policy requires a support window."
      - id: b
        text: "12 months or 6 releases."
        explanation: "This is not the beta window in the policy."
      - id: c
        text: "It is kept forever."
        explanation: "Stable versions are kept within a major version. Beta versions are removed after the window."
      - id: d
        text: "9 months or 3 releases, whichever is longer."
        explanation: "Correct. The policy sets this window for beta REST API versions."
    correct_option: d
    explanation: "The policy sets this window for beta REST API versions."

  - id: ats040-030-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find deprecated API use"
    source_readings:
      - sections/section-030/module-02/course-02-deprecation-policy-and-finding-deprecated-use.md
    prompt: |-
      How can an operator see whether clients still call deprecated API versions on a running cluster?
    options:
      - id: a
        text: "Read the `apiserver_requested_deprecated_apis` metric from the API server."
        explanation: "Correct. The API server counts requests to deprecated versions, which shows who still uses them."
      - id: b
        text: "Restart the API server and read its version."
        explanation: "A restart does not report client use."
      - id: c
        text: "Run `kubectl get pods` in each namespace."
        explanation: "This lists pods and does not show requested API versions."
      - id: d
        text: "Read the Node status."
        explanation: "Node status does not hold API usage."
    correct_option: a
    explanation: "The API server counts requests to deprecated versions, which shows who still uses them."

  - id: ats040-030-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Check a migrated manifest"
    source_readings:
      - sections/section-030/module-02/course-03-migrating-manifests-to-current-versions.md
    prompt: |-
      A manifest was changed from a removed version to the current one. Which command checks it against the real API server without storing anything?
    options:
      - id: a
        text: "`kubectl apply --dry-run=client -f file.yaml`"
        explanation: "A client dry run does not ask the server, so it cannot find a version the server does not serve."
      - id: b
        text: "`kubectl apply --dry-run=server -f file.yaml`"
        explanation: "Correct. A server-side dry run sends the object through validation and admission, and then discards it."
      - id: c
        text: "`kubectl create -f file.yaml --force`"
        explanation: "This creates or recreates the object."
      - id: d
        text: "`kubectl delete -f file.yaml`"
        explanation: "This deletes the object and checks nothing."
    correct_option: b
    explanation: "A server-side dry run sends the object through validation and admission, and then discards it."

  - id: ats040-030-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what a feature gate does"
    source_readings:
      - sections/section-030/module-02/course-01-api-maturity-levels-and-feature-gates.md
    prompt: |-
      What does a feature gate do?
    options:
      - id: a
        text: "It limits how many pods a node can run."
        explanation: "That is a kubelet setting, not a feature gate."
      - id: b
        text: "It blocks traffic between namespaces."
        explanation: "That is a network policy."
      - id: c
        text: "It turns a Kubernetes feature on or off, and its default depends on the maturity of the feature."
        explanation: "Correct. Gates let a cluster operator enable an alpha feature or disable a beta one."
      - id: d
        text: "It signs container images."
        explanation: "Signing is a separate supply chain step."
    correct_option: c
    explanation: "Gates let a cluster operator enable an alpha feature or disable a beta one."

