apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: orbit
  labels:
    app: beacon
  annotations:
    kubernetes.io/change-cause: "fix readiness path from /ready to /readyz"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      containers:
        - name: beacon
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: beacon-sweep
  namespace: orbit
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sweep
              image: curlimages/curl:8.22.0
              command: ["curl", "-s", "-m", "5", "http://beacon.orbit.svc.cluster.local/healthz"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: change-record
  namespace: orbit
data:
  replaced-api: batch/v1beta1
  replacement-api: batch/v1
  replaced-maturity: beta
  beta-support-months: "9"
  beta-support-releases: "3"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: issue-report
  namespace: orbit
data:
  title: beacon readiness probe path returns 404
  kind: bug
  sig: sig-apps
