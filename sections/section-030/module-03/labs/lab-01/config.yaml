# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Record Release Facts That Match The Cluster (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-040-lab-030-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

# Starting state.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting objects
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: exists
      description: "ConfigMap release-facts exists in starfleet"
      type: file
      source: validation/validate-exists.sh
      hint: "Create the ConfigMap in the namespace starfleet."
    - name: version
      description: "serverVersion matches the version of the cluster"
      type: file
      source: validation/validate-version.sh
      hint: "Read the version with kubectl version -o json and copy gitVersion."
    - name: cadence
      description: "releasesPerYear is 3"
      type: file
      source: validation/validate-cadence.sh
      hint: "Kubernetes makes three minor releases per year."
    - name: support
      description: "supportedMinorVersions is 3"
      type: file
      source: validation/validate-support.sh
      hint: "The project maintains release branches for the three most recent minor versions."
    - name: annotation
      description: "The annotation owner-sig is sig-release"
      type: file
      source: validation/validate-annotation.sh
      hint: "Add the annotation under metadata.annotations."

teardown:
  keepCluster: false
