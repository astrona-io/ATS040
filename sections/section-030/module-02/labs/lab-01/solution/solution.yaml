apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-sweep
  namespace: starfleet
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sweep
              image: curlimages/curl:8.22.0
              command: ["curl", "-fsS", "http://scout.starfleet.svc.cluster.local/healthz"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scout
  namespace: starfleet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scout
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scout-pdb
  namespace: starfleet
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: scout
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-notes
  namespace: starfleet
data:
  cronjob: batch/v1
  hpa: autoscaling/v2
  pdb: policy/v1
